apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-smoke-test
  labels:
    app: smoke-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-smoke-test
spec:
  selector:
    app: smoke-test
  ports:
    - port: 80
      targetPort: 80